<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Image Marquee</title>

    <!-- Tailwind CDN to reset default styles -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Style -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="ar-marquee" data-ar-marquee>
      <div class="ar-marquee__content" data-ar-marquee-content>
        <img
          src="https://cdn.pixabay.com/photo/2017/02/08/17/24/fantasy-2049567_1280.jpg"
          alt="nature"
        />
        <img
          src="https://cdn.pixabay.com/photo/2012/03/01/00/55/flowers-19830_1280.jpg"
          alt="nature"
        />
        <img
          src="https://cdn.pixabay.com/photo/2014/02/27/16/10/flowers-276014_1280.jpg"
          alt="nature"
        />
        <img
          src="https://cdn.pixabay.com/photo/2016/11/14/04/45/elephant-1822636_1280.jpg"
          alt="nature"
        />
      </div>
    </div>

    <!-- Script -->
    <script src="main.js"></script>
  </body>
</html>
